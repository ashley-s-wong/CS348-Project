<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Patient</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Add a New Patient</h2>
        
        {% if success %}
        <div class="alert alert-success">
            Patient added successfully!
        </div>
        {% endif %}
        
        <form action="/add_patient" method="POST">
            <div class="form-group">
                <label for="name">Patient Name</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="text" class="form-control" id="phone" name="phone" required>
            </div>
            <div class="form-group">
                <label for="insurance_id">Insurance ID</label>
                <input type="text" class="form-control" id="insurance_id" name="insurance_id" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Add Patient</button>
        </form>
        <a href="/" class="btn btn-secondary mt-3">Back to Patient List</a>
    </div>
</body>
</html>
