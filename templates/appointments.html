<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h1 class="text-center mt-4">Appointments</h1>

        <!-- Filter Form -->
        <form method="GET" action="{{ url_for('appointments') }}" class="row g-3 mb-4">
            <div class="col-md-3">
                <label class="form-label">Doctor Name</label>
                <input type="text" name="doctor_name" class="form-control" value="{{ request.args.get('doctor_name', '') }}">
            </div>
            <div class="col-md-3">
                <label class="form-label">Patient Name</label>
                <input type="text" name="patient_name" class="form-control" value="{{ request.args.get('patient_name', '') }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Min Duration</label>
                <input type="number" name="min_duration" class="form-control" value="{{ request.args.get('min_duration', '') }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">Start Date</label>
                <input type="date" name="start_date" class="form-control" value="{{ request.args.get('start_date', '') }}">
            </div>
            <div class="col-md-2">
                <label class="form-label">End Date</label>
                <input type="date" name="end_date" class="form-control" value="{{ request.args.get('end_date', '') }}">
            </div>
            <div class="col-12 d-flex justify-content-end">
                <button type="submit" class="btn btn-primary mt-3">Apply Filters</button>
            </div>
        </form>

        <!-- Appointments Table -->
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Duration (min)</th>
                    <th>Doctor</th>
                    <th>Patient</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for appt in appointments %}
                <tr>
                    <td>{{ appt.date }}</td>
                    <td>{{ appt.time }}</td>
                    <td>{{ appt.duration }}</td>
                    <td>{{ appt.doctor.name }}</td>
                    <td>{{ appt.patient.name }}</td>
                    <td>
                        <a href="{{ url_for('edit_appointment', id=appt.id) }}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{{ url_for('delete_appointment', id=appt.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this appointment?');">Delete</a>
                    </td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="6" class="text-center">No appointments found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

        <a href="{{ url_for('add_appointment') }}" class="btn btn-success">Add Appointment</a>
    </div>
</body>
</html>
