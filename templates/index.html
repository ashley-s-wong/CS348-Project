<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient and Doctor List</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Patient List</h2>
        <a href="/add_patient" class="btn btn-primary mb-3">Add New Patient</a>
        <a href="/add_doctor" class="btn btn-secondary mb-3">Add New Doctor</a> <!-- Add this line -->
        <a href="/appointments" class="btn btn-info mb-3">View Appointments</a> <!-- Link to appointments -->
        <a href="/appointments/add" class="btn btn-success mb-3">Add New Appointment</a> <!-- Link to add appointment -->
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Insurance ID</th>
                </tr>
            </thead>
            <tbody>
                {% for patient in patients %}
                <tr>
                    <td>{{ patient.patient_id }}</td>
                    <td>{{ patient.name }}</td>
                    <td>{{ patient.email }}</td>
                    <td>{{ patient.phone }}</td>
                    <td>{{ patient.insurance_id }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
