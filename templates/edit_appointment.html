<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Appointment</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">Edit Appointment</h2>

        <form action="/appointments/edit/{{ appointment.id }}" method="POST">
            <div class="form-group">
                <label for="patient_id">Patient</label>
                <select class="form-control" id="patient_id" name="patient_id" required>
                    {% for patient in patients %}
                    <option value="{{ patient.patient_id }}" {% if patient.patient_id= =appointment.patient_id %}selected{% endif %}>{{ patient.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="doctor_id">Doctor</label>
                <select class="form-control" id="doctor_id" name="doctor_id" required>
                    {% for doctor in doctors %}
                    <option value="{{ doctor.id }}" {% if doctor.id= =appointment.doctor_id %}selected{% endif %}>{{ doctor.name }}</option>
                    {% endfor %}
                </select>
            </div>
